name: Publish TV source

on:
  workflow_dispatch:
    inputs:
      filename:
        description: Flat filename to publish inside sources/
        required: true
        type: string
      upload_url:
        description: Temporary Vercel Blob URL
        required: true
        type: string
      request_id:
        description: Dashboard upload identifier
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-source-${{ inputs.filename }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and validate temporary source
        env:
          SOURCE_FILENAME: ${{ inputs.filename }}
          UPLOAD_URL: ${{ inputs.upload_url }}
          SOURCE_MAX_BYTES: "99614720"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          name = os.environ["SOURCE_FILENAME"]
          allowed = {"mp4", "mov", "m4v", "webm", "mp3", "wav", "ogg", "jpg", "jpeg", "png", "gif", "bmp", "webp", "pdf", "ppt", "pptx"}
          if not name or len(name) > 120 or name in {".", ".."}:
              raise SystemExit("Invalid filename length.")
          if name.startswith(".") or any(character in name for character in "/\\\x00"):
              raise SystemExit("Source must use a visible flat filename.")
          if any(ord(character) < 32 for character in name):
              raise SystemExit("Source filename contains a control character.")
          if name.rsplit(".", 1)[-1].lower() not in allowed:
              raise SystemExit("Unsupported source filename extension.")
          Path("sources").mkdir(exist_ok=True)
          target = Path("sources") / name
          if target.exists():
              raise SystemExit("A source with this filename already exists.")
          print(f"SOURCE_TARGET={target}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SOURCE_TARGET={target}\n")
          PY
          export SOURCE_TARGET="sources/${SOURCE_FILENAME}"
          curl --fail --location --proto '=https' --max-filesize "$SOURCE_MAX_BYTES" --output "${SOURCE_TARGET}.part" "$UPLOAD_URL"
          actual_size="$(stat -c%s "${SOURCE_TARGET}.part")"
          test "$actual_size" -gt 0
          test "$actual_size" -le "$SOURCE_MAX_BYTES"
          mv "${SOURCE_TARGET}.part" "$SOURCE_TARGET"

      - name: Commit source to main
        env:
          SOURCE_FILENAME: ${{ inputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if git ls-tree -r --name-only HEAD -- "sources/${SOURCE_FILENAME}" | grep -qx "sources/${SOURCE_FILENAME}"; then
            echo "A source with this filename was published while this job was queued."
            exit 1
          fi
          git add -- "$SOURCE_TARGET"
          git config user.name "tv-source-dashboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "source-manager: add ${SOURCE_FILENAME}"
          git push origin HEAD:main

      - name: Remove temporary Vercel Blob
        if: always()
        working-directory: frontend
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLOB_READ_WRITE_TOKEN"
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { del } from "@vercel/blob";
          await del(process.env.UPLOAD_URL, { token: process.env.BLOB_READ_WRITE_TOKEN });
          NODE
