name: Publish TV source

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Path relative to sources/ where this source will be published
        required: true
        type: string
      upload_url:
        description: Temporary Vercel Blob URL
        required: true
        type: string
      request_id:
        description: Dashboard upload identifier
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-source-${{ inputs.source_path }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and validate temporary source
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          UPLOAD_URL: ${{ inputs.upload_url }}
          SOURCE_MAX_BYTES: "99614720"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import re

          source_path = os.environ["SOURCE_PATH"]
          allowed = {"mp4", "mov", "m4v", "webm", "mp3", "wav", "ogg", "jpg", "jpeg", "png", "gif", "bmp", "webp", "pdf", "ppt", "pptx"}
          parts = PurePosixPath(source_path).parts
          if not source_path or len(parts) > 5 or any(part in {"", ".", ".."} for part in parts):
              raise SystemExit("Invalid source path.")
          if any(part.startswith(".") or not re.fullmatch(r"[\w][\w ._()'&-]{0,119}", part, re.UNICODE) for part in parts):
              raise SystemExit("Source path contains an unsupported name.")
          if parts[-1].rsplit(".", 1)[-1].lower() not in allowed:
              raise SystemExit("Unsupported source filename extension.")
          target = Path("sources", *parts)
          target.parent.mkdir(parents=True, exist_ok=True)
          if target.exists():
              raise SystemExit("A source with this path already exists.")
          print(f"SOURCE_TARGET={target}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SOURCE_TARGET={target}\n")
          PY
          export SOURCE_TARGET="sources/${SOURCE_PATH}"
          curl --fail --location --proto '=https' --max-filesize "$SOURCE_MAX_BYTES" --output "${SOURCE_TARGET}.part" "$UPLOAD_URL"
          actual_size="$(stat -c%s "${SOURCE_TARGET}.part")"
          test "$actual_size" -gt 0
          test "$actual_size" -le "$SOURCE_MAX_BYTES"
          mv "${SOURCE_TARGET}.part" "$SOURCE_TARGET"

      - name: Commit source to main
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if git ls-tree -r --name-only HEAD -- "sources/${SOURCE_PATH}" | grep -qx "sources/${SOURCE_PATH}"; then
            echo "A source with this path was published while this job was queued."
            exit 1
          fi
          git add -- "$SOURCE_TARGET"
          git config user.name "tv-source-dashboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "source-manager: add ${SOURCE_PATH}"
          git push origin HEAD:main

      - name: Remove temporary Vercel Blob
        if: always()
        working-directory: frontend
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLOB_READ_WRITE_TOKEN"
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { del } from "@vercel/blob";
          await del(process.env.UPLOAD_URL, { token: process.env.BLOB_READ_WRITE_TOKEN });
          NODE
